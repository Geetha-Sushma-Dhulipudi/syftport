name: Build and Test

permissions:
  contents: write
  statuses: write
  actions: read
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'cicd*.groovy'
      - '**/LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-test:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run tests')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    uses: zopencommunity/meta/.github/workflows/build_and_test.yml@main
    secrets: inherit

  summarize-failure-with-copilot:
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Test Copilot with a prompt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "COPILOT_GITHUB_TOKEN secret is missing."
            exit 1
          fi

          SUMMARY_FILE="$RUNNER_TEMP/copilot-summary.txt"
          export SUMMARY_FILE

          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');

          // Custom test question for GitHub Copilot
          const prompt = `You are GitHub Copilot. Please answer the following test question:
          "What is IBM z/OS, and why is porting open-source software (like direnv or syft) to z/OS important?"
          Provide a concise 3-bullet point answer.`;

          const result = spawnSync(
            'copilot',
            ['-p', prompt, '-s', '--no-ask-user'],
            {
              encoding: 'utf8',
              timeout: 120000,
              maxBuffer: 1024 * 1024,
              env: process.env
            }
          );

          if (result.error) {
            console.error(result.error.message);
            process.exit(1);
          }

          if (result.status !== 0) {
            console.error(result.stderr || 'Copilot failed.');
            process.exit(result.status || 1);
          }

          const summary = (result.stdout || '').trim();
          fs.writeFileSync(process.env.SUMMARY_FILE, summary);
          console.log('Copilot response received successfully.');
          NODE

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Post Copilot response to PR
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ runner.temp }}/copilot-summary.txt
        with:
          script: |
            const fs = require('fs');

            const issueNumber =
              context.payload.pull_request?.number ||
              (context.payload.issue?.pull_request ? context.payload.issue.number : null);

            if (!issueNumber) {
              core.info('No pull request number found; skipping comment.');
              return;
            }

            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').trim();

            const body = [
              '### 🤖 GitHub Copilot Verification Test',
              '',
              summary,
              '',
              '---',
              '*To re-run this test, comment `/run tests` on this PR.*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
