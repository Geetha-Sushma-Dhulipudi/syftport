name: Build and Test

permissions:
  contents: write
  statuses: write
  actions: read
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'cicd*.groovy'
      - '**/LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-test:
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/run tests')) || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_target'
    uses: zopencommunity/meta/.github/workflows/build_and_test.yml@main
    secrets: inherit

  summarize-failure-with-ai:
    needs: build-and-test
    # Only runs when build-and-test FAILS
    if: always() && needs.build-and-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Analyze failure and post AI comment
        uses: actions/github-script@v7
        env:
          TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          script: |
            const https = require('https');

            // 1. Find which PR this is
            const issueNumber = context.payload.pull_request 
              ? context.payload.pull_request.number 
              : context.payload.issue?.number;

            if (!issueNumber) return;

            // 2. Identify failed step
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.data.jobs.find(j => j.conclusion === 'failure');
            const failedStepName = failed ? failed.name : 'z/OS Build Job';

            // 3. Prompt for the AI
            const prompt = `A build and test workflow failed in repository "${context.repo.repo}".
            Failed Job: "${failedStepName}"
            
            Give a brief summary:
            1. What failed
            2. Likely reason on z/OS
            3. Actionable next steps for the developer.`;

            // 4. Send request to GitHub's AI service
            const payload = JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: "You are an automated CI failure triager for z/OS ported software." },
                { role: "user", content: prompt }
              ]
            });

            const req = https.request({
              hostname: 'models.inference.ai.azure.com',
              path: '/chat/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.TOKEN}`,
                'User-Agent': 'CI-Failure-Triager'
              }
            }, (res) => {
              let body = '';
              res.on('data', chunk => body += chunk);
              res.on('end', async () => {
                let aiText = '';
                try {
                  const data = JSON.parse(body);
                  aiText = data.choices[0].message.content;
                } catch (e) {
                  aiText = `Failed job: \`${failedStepName}\`. Please inspect raw logs in the Actions tab.`;
                }

                // 5. Post comment on the PR
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `### 🤖 Automated Failure Summary\n\n${aiText}\n\n---\n*To rerun tests, comment \`/run tests\` on this PR.*`
                });
              });
            });

            req.write(payload);
            req.end();
