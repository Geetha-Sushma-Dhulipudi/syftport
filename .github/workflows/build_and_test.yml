name: Build and Test

permissions:
  contents: write
  statuses: write
  actions: read
  pull-requests: write
  issues: write

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'cicd*.groovy'
      - '**/LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-test:
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/run tests')) || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_target'
    uses: zopencommunity/meta/.github/workflows/build_and_test.yml@main
    secrets: inherit

  summarize-failure-with-ai:
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Analyze failure and post AI comment
        uses: actions/github-script@v7
        env:
          AI_TOKEN: ${{ secrets.BUMP_TOKEN }}
        with:
          script: |
            const https = require('https');

            // 1. Identify PR Number
            let issueNumber = null;
            if (context.payload.pull_request) {
              issueNumber = context.payload.pull_request.number;
            } else if (context.payload.issue && context.payload.issue.pull_request) {
              issueNumber = context.payload.issue.number;
            }

            if (!issueNumber) {
              core.setFailed("No Pull Request number found.");
              return;
            }

            // 2. Identify the failed job
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.data.jobs.find(j => j.conclusion === 'failure');
            const failedStepName = failed ? failed.name : 'trigger-jenkins-job';

            // 3. Fallback diagnostic generator for z/OS port failures
            function getLocalZOSDiagnosis(stepName) {
              if (stepName.includes('trigger-jenkins-job')) {
                return `#### 🔍 Root Cause Analysis:
            * **Failed Step**: \`${stepName}\`
            * **Cause**: The workflow attempted to trigger a build on the remote IBM z/OS Jenkins cluster, but the required Jenkins credentials (\`JENKINS_URL\`, \`JENKINS_USER\`, \`JENKINS_TOKEN\`) are not configured in this repository's secrets.
            * **Why this occurs**: Access to the mainframe build infrastructure is managed centrally by the \`zopencommunity\` organization for security.

            #### 🛠️ Recommended Actions:
            1. **For Personal Repositories/Forks**: You can verify the port logic locally or test configuration syntax in \`buildenv\`.
            2. **For Official Releases**: Once this PR is submitted to the upstream \`zopencommunity\` repository, the central Jenkins cluster secrets will authenticate and run the full z/OS test suite automatically.`;
              } else {
                return `#### 🔍 Root Cause Analysis:
            * **Failed Step**: \`${stepName}\`
            * **Cause**: Build or test execution encountered an error on z/OS.
            * **Recommended Actions**: Inspect the raw step logs in the Actions tab for compiler or test suite traces.`;
              }
            }

            // 4. Call GitHub Models Endpoint
            function callGitHubModels(token, stepName) {
              return new Promise((resolve) => {
                const prompt = `A build and test workflow failed in repository "${context.repo.repo}".
            Failed Job: "${stepName}"

            Provide a concise summary:
            1. What failed
            2. Likely cause on z/OS
            3. Recommended next steps for the developer.`;

                const payload = JSON.stringify({
                  model: "gpt-4o-mini",
                  messages: [
                    { role: "system", content: "You are an automated CI failure triager for IBM z/OS ported software." },
                    { role: "user", content: prompt }
                  ]
                });

                const req = https.request({
                  hostname: 'models.github.ai',
                  path: '/inference/chat/completions',
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    'User-Agent': 'CI-Failure-Triager',
                    'Content-Length': Buffer.byteLength(payload)
                  },
                  timeout: 10000
                }, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.choices && parsed.choices[0]) {
                        resolve(parsed.choices[0].message.content);
                      } else {
                        resolve(getLocalZOSDiagnosis(stepName));
                      }
                    } catch (e) {
                      resolve(getLocalZOSDiagnosis(stepName));
                    }
                  });
                });

                req.on('error', () => resolve(getLocalZOSDiagnosis(stepName)));
                req.on('timeout', () => { req.destroy(); resolve(getLocalZOSDiagnosis(stepName)); });
                req.write(payload);
                req.end();
              });
            }

            const aiSummary = await callGitHubModels(process.env.AI_TOKEN, failedStepName);

            const commentBody = `### 🤖 Automated Failure Summary\n\n${aiSummary}\n\n---\n*To rerun tests, comment \`/run tests\` on this PR.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
