name: Build and Test

permissions:
  contents: write
  statuses: write
  actions: read
  pull-requests: write
  issues: write

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'cicd*.groovy'
      - '**/LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-test:
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/run tests')) || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_target'
    uses: zopencommunity/meta/.github/workflows/build_and_test.yml@main
    secrets: inherit

  summarize-failure-with-ai:
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Analyze failure and post AI comment
        uses: actions/github-script@v7
        env:
          AI_TOKEN: ${{ secrets.BUMP_TOKEN }}
        with:
          script: |
            const https = require('https');

            // 1. Identify PR Number
            let issueNumber = null;
            if (context.payload.pull_request) {
              issueNumber = context.payload.pull_request.number;
            } else if (context.payload.issue && context.payload.issue.pull_request) {
              issueNumber = context.payload.issue.number;
            }

            console.log("Target PR Number:", issueNumber);
            if (!issueNumber) {
              core.setFailed("No Pull Request number found.");
              return;
            }

            // 2. Identify the failed job name
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.data.jobs.find(j => j.conclusion === 'failure');
            const failedStepName = failed ? failed.name : 'z/OS Build and Test Job';
            console.log("Failed Step Detected:", failedStepName);

            // 3. Prepare AI Prompt
            const prompt = `A build and test workflow failed in repository "${context.repo.repo}".
            Failed Job: "${failedStepName}"

            Please provide a structured failure summary:
            1. **What Failed**: Identify the failed step.
            2. **Root Cause**: Explain why it failed (e.g. Jenkins runner secrets or environment on personal forks, missing buildenv settings).
            3. **Actionable Fix**: Steps for the developer to resolve or proceed. Keep it concise.`;

            const requestBody = JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: "You are an automated CI failure triager for IBM z/OS ported software." },
                { role: "user", content: prompt }
              ]
            });

            // 4. Helper function with Promise to ensure it WAITS for response
            function callAI(token, payload) {
              return new Promise((resolve) => {
                const req = https.request({
                  hostname: 'models.inference.ai.azure.com',
                  path: '/chat/completions',
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    'User-Agent': 'CI-Failure-Triager',
                    'Content-Length': Buffer.byteLength(payload)
                  },
                  timeout: 20000
                }, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.choices && parsed.choices[0]) {
                        resolve(parsed.choices[0].message.content);
                      } else {
                        resolve(`Failed step: \`${failedStepName}\`. API Response: ${data}`);
                      }
                    } catch (e) {
                      resolve(`Failed step: \`${failedStepName}\`. (Response parse error: ${e.message})`);
                    }
                  });
                });

                req.on('error', (err) => {
                  resolve(`Failed step: \`${failedStepName}\`. (Network error: ${err.message})`);
                });

                req.write(payload);
                req.end();
              });
            }

            // 5. Await AI result
            console.log("Sending request to AI endpoint...");
            const aiSummary = await callAI(process.env.AI_TOKEN, requestBody);
            console.log("AI Summary Generated:", aiSummary);

            // 6. Post comment to PR
            const commentBody = `### 🤖 Automated Failure Summary\n\n${aiSummary}\n\n---\n*To rerun tests, comment \`/run tests\` on this PR.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

            console.log("Comment posted successfully!");
